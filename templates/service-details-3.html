<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-time Alerts - Stocker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h1>Real-time Alerts</h1>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <div class="content">
        <h2>Never Miss a Beat</h2>
        <p>Configure custom alerts for price thresholds, volume spikes, and news events. Delivered instantly via SMS or Email.</p>
        
        <div class="alert-box" style="border: 1px solid #ccc; padding: 10px; margin-top: 20px;">
            <h3>Configure Alert</h3>
            <form>
                <input type="text" placeholder="Ticker (e.g. NFLX)">
                <input type="number" placeholder="Target Price">
                <button type="button">Set Alert</button>
            </form>
        </div>
        
        <p><em>(This is a premium service simulation.)</em></p>
    </div>
</body>
</html>
